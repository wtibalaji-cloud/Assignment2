<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil Nadu Police - Demo Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b1f3a, #163d68);
    }

    .login-box {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }

    .badge {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #10243d;
    }

    h1 {
      font-size: 24px;
      color: #12345b;
      margin-bottom: 5px;
    }

    .demo {
      color: #c0392b;
      font-size: 13px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #1b5e96;
      box-shadow: 0 0 5px rgba(27,94,150,0.3);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #12345b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b2745;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="badge">POLICE</div>

    <h1>Tamil Nadu Police</h1>
    <p class="demo">DEMO / PRACTICE LOGIN</p>

    <form id="loginForm">

      <div class="input-group">
        <label for="username">User Name</label>
        <input
          type="text"
          id="username"
          placeholder="Enter User Name"
          required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          required>
      </div>

      <button type="submit">Login</button>

      <p id="message"></p>
    </form>

    <div class="footer">
      This is a fictional demonstration page and is not an official
      Tamil Nadu Police website.
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Demo login submitted successfully.";
      document.getElementById("message").style.color = "green";
    });
  </script>

</body>
</html>
